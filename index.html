<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BEAT ROOM SOLO</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 10%,#ffe0f1,transparent 36%),radial-gradient(circle at 90% 25%,#d8e7ff,transparent 42%),#fff8ee;color:#30244e;font:15px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:28px 20px}header{display:flex;align-items:center;gap:18px;margin:0 0 22px}.logo{background:#ff6a9f;color:white;border:3px solid #30244e;box-shadow:4px 4px 0 #30244e;border-radius:20px;padding:12px 16px;font-size:28px;font-weight:1000;transform:rotate(-7deg)}h1{font-size:clamp(32px,6vw,60px);font-weight:1000;letter-spacing:-.07em;line-height:1;margin:0;color:#30244e}header p{margin:7px 0 0;font-weight:700;color:#8a729b}section{background:#fff;border:2px solid #30244e;padding:18px;border-radius:24px;margin:12px 0;box-shadow:5px 6px 0 #30244e}input,button,select{font:inherit;color:#30244e;background:#f8f4ff;border:2px solid #30244e;border-radius:12px;padding:10px 13px;margin:4px;font-weight:750}button{cursor:pointer;background:#fce27e;box-shadow:0 3px 0 #30244e;transition:transform .12s,background .12s}button:hover{transform:translateY(-2px);background:#fff0a7}button:active{transform:translateY(3px);box-shadow:none}#embedded{background:#ff6a9f;color:white}#demo{background:#98edce}#stop{background:#eee5ff}input#url{width:min(100%,520px)}input[type=number]{width:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}canvas{width:100%;display:block;border:2px solid #30244e;border-radius:18px;background:#211b40}#pads{display:flex;gap:5px;margin-top:10px}#pads button{flex:1;min-width:0;font-size:28px;touch-action:none;padding:5px;color:#30244e!important}#pads svg{width:31px;height:31px;display:block;margin:auto}#player iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}#status{color:#7251a2;font-weight:800;margin-top:12px}#stats{font-weight:950;font-size:19px;letter-spacing:.03em;margin-bottom:12px}p{line-height:1.65;color:#756985;font-size:13px}a{color:#7251a2}@media(max-width:740px){.grid{grid-template-columns:1fr}main{padding:18px 12px}}</style><main><header><div class="logo">♫</div><div><h1>BEAT ROOM<span style="color:#ff6a9f">!</span></h1><p>SOLO MODE / 好きな曲でリズムに乗ろう！</p></div></header><section><input id="url" placeholder="YouTubeのURL"><button id="load">曲を選ぶ</button><button id="open">YouTubeで再生</button><p>埋め込みが再生できない場合も、別タブのYouTubeと一緒に遊べます。</p><label>BPM <input id="bpm" type="number" min="40" max="240" value="120"></label><button id="tap">拍に合わせてタップ</button><label>開始位置（秒）<input id="offset" type="number" min="0" step="0.1" value="1"></label><label>難易度 <select id="level"><option value="1">EASY</option><option value="2" selected>NORMAL</option><option value="3">HARD</option></select></label><br><button id="start">ゲーム開始（別タブ再生用）</button><button id="embedded">動画と同時に開始</button><button id="demo">練習（音付き）</button><button id="stop">終了</button><div id="status" role="status">曲を選ぶか、練習から始めましょう。</div></section><div class="grid"><section><div id="stats">SCORE 0　COMBO 0</div><canvas id="board" width="480" height="480"></canvas><div id="pads"></div></section><section><div id="player"></div><p>別タブモード：YouTubeで曲を再生し、ゲームに戻って開始を押してください。開始位置を調整して拍を合わせられます。Pキーで一時停止・再開（ゲーム側のみ）。</p><p>ノーツはBPMから生成します。音源の自動解析ではありません。</p></section></div></main><script>
const $=x=>document.getElementById(x), ctx=$('board').getContext('2d'), arrows=['←','↓','↑','→'],keys=['ArrowLeft','ArrowDown','ArrowUp','ArrowRight'],colors=['#ff82bd','#72c9ff','#a4ef9c','#ffd366'];let video='',player=null,ready=false,mode='',active=false,paused=false,started=0,held=0,notes=[],score=0,combo=0,best=0,judge='',judgeAt=0,audio,lastBeat=-1,bpm=120,duration=180,taps=[];const say=s=>$('status').textContent=s;function parse(s){try{let u=new URL(s);if(u.hostname==='youtu.be')return u.pathname.split('/')[1];if(u.hostname==='youtube.com'||u.hostname.endsWith('.youtube.com'))return u.searchParams.get('v')||u.pathname.split('/').pop()}catch{}return s.trim()};function select(){let id=parse($('url').value);if(!/^[\w-]{11}$/.test(id)){say('YouTubeのURLを確認してください');return false}video=id;if(ready)player.cueVideoById(video);else if(!player){$('player').replaceChildren();let f=document.createElement('iframe');f.src='https://www.youtube.com/embed/'+video;f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;$('player').append(f)}say('曲を選択しました。別タブ再生はAPI不要です。');return true} $('load').onclick=select;$('open').onclick=()=>{if(select())window.open('https://www.youtube.com/watch?v='+video,'_blank','noopener')};window.onYouTubeIframeAPIReady=()=>{ $('player').innerHTML='<div id="yt"></div>';player=new YT.Player('yt',{playerVars:{playsinline:1,...(location.protocol!=='file:'?{origin:location.origin}:{})},events:{onReady:()=>{ready=true;if(video)player.cueVideoById(video)},onError:()=>say('埋め込み再生不可。YouTubeで再生ボタンをご利用ください。')}})};let script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';document.head.append(script);
$('tap').onclick=()=>{let t=performance.now();if(t-(taps.at(-1)||0)>2000)taps=[];taps.push(t);if(taps.length>8)taps.shift();if(taps.length>1)$('bpm').value=Math.max(40,Math.min(240,Math.round(60000*(taps.length-1)/(t-taps[0]))))};function begin(m){if(m!=='demo'&&!video&&!select())return;if(m==='embed'&&!ready){say('動画連携が利用できません。別タブ再生用で遊べます。');return}if(active&&mode==='embed')player.pauseVideo();mode=m;active=true;paused=false;score=combo=best=0;judge='';lastBeat=-1;bpm=Math.max(40,Math.min(240,+$('bpm').value||120));let level=+$('level').value,offset=Math.max(0,+$('offset').value||0);duration=m==='demo'?30:m==='embed'?(player.getDuration()||600):600;notes=[];let step=60/bpm*(level===1?2:level===3?.5:1);for(let t=offset;t<duration;t+=step)notes.push({t,l:Math.floor(Math.random()*4),done:false});started=performance.now();if(m==='embed'){player.seekTo(0,true);player.playVideo()}if(m==='demo'){audio=audio||new AudioContext();audio.resume()}document.activeElement.blur();say('PLAY!')} $('start').onclick=()=>begin('manual');$('embedded').onclick=()=>begin('embed');$('demo').onclick=()=>begin('demo');function finish(){if(active&&mode==='embed')player.pauseVideo();active=false;say('FINISH! スコア '+score+' / 最大コンボ '+best)}$('stop').onclick=finish;function time(){return mode==='embed'?player.getCurrentTime():((paused?held:performance.now())-started)/1000}function hit(l){if(!active||paused)return;let t=time(),n=notes.filter(n=>!n.done&&n.l===l&&Math.abs(n.t-t)<.19).sort((a,b)=>Math.abs(a.t-t)-Math.abs(b.t-t))[0];if(n){n.done=true;let e=Math.abs(n.t-t);judge=e<.065?'PERFECT':e<.12?'GREAT':'GOOD';score+=e<.065?1000:e<.12?700:400;best=Math.max(best,++combo)}else{judge='MISS';combo=0}judgeAt=performance.now()}addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(keys.includes(e.key)){e.preventDefault();if(!e.repeat)hit(keys.indexOf(e.key))}if(e.key.toLowerCase()==='p'&&active&&!e.repeat){if(paused){started+=performance.now()-held;paused=false;if(mode==='embed')player.playVideo()}else{held=performance.now();paused=true;if(mode==='embed')player.pauseVideo()}}});arrows.forEach((a,i)=>{let b=document.createElement('button');b.innerHTML=`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5 L56 29 Q59 33 54 35 H43 V55 Q43 59 39 59 H25 Q21 59 21 55 V35 H10 Q5 33 8 29 Z" transform="rotate(${[-90,180,0,90][i]} 32 32)" fill="#30244e"/></svg>`;b.setAttribute('aria-label',a);b.style.background=colors[i];b.onpointerdown=e=>{e.preventDefault();hit(i)};$('pads').append(b)});function tone(){let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=650;g.gain.setValueAtTime(.15,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.09);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.1)}function arrow(x,y,i,size,target=false){ctx.save();ctx.translate(x,y);ctx.rotate([-Math.PI/2,Math.PI,0,Math.PI/2][i]);ctx.scale(size/64,size/64);ctx.translate(-32,-32);ctx.beginPath();ctx.moveTo(32,5);ctx.lineTo(56,29);ctx.quadraticCurveTo(60,35,53,36);ctx.lineTo(44,36);ctx.lineTo(44,54);ctx.quadraticCurveTo(44,60,38,60);ctx.lineTo(26,60);ctx.quadraticCurveTo(20,60,20,54);ctx.lineTo(20,36);ctx.lineTo(11,36);ctx.quadraticCurveTo(4,35,8,29);ctx.closePath();ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle=target?colors[i]:'#211b40';ctx.fillStyle=target?'#30264d':colors[i];if(!target){ctx.shadowColor=colors[i];ctx.shadowBlur=13;}ctx.fill();ctx.shadowBlur=0;ctx.stroke();if(!target){ctx.globalAlpha=.65;ctx.strokeStyle='white';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(15,28);ctx.lineTo(32,11);ctx.stroke();}ctx.restore()}
function draw(){requestAnimationFrame(draw);ctx.clearRect(0,0,480,480);ctx.textAlign='center';for(let i=0;i<4;i++){ctx.fillStyle=i%2?'#292144':'#221b3b';ctx.fillRect(i*120,0,119,480);ctx.globalAlpha=.11;ctx.fillStyle=colors[i];ctx.fillRect(i*120+5,0,110,480);ctx.globalAlpha=1;ctx.fillStyle='#141029';ctx.beginPath();ctx.roundRect(i*120+9,374,102,94,18);ctx.fill();arrow(i*120+60,420,i,70,true)}ctx.strokeStyle='#ffffff88';ctx.setLineDash([5,8]);ctx.beginPath();ctx.moveTo(0,420);ctx.lineTo(480,420);ctx.stroke();ctx.setLineDash([]);if(active){let t=time();if(mode==='demo'&&!paused){let b=Math.floor(t*bpm/60);if(b!==lastBeat){lastBeat=b;tone()}}for(const n of notes){if(n.done)continue;let dt=n.t-t;if(dt<-.19){n.done=true;combo=0;judge='MISS';judgeAt=performance.now();continue}if(dt>2)break;arrow(n.l*120+60,420-dt*230,n.l,76)}if(t>=duration||(mode==='embed'&&t>0&&player.getPlayerState()===0))finish()}if(performance.now()-judgeAt<650&&judge){ctx.font='1000 37px system-ui';ctx.lineJoin='round';ctx.lineWidth=7;ctx.strokeStyle='#211b40';ctx.strokeText(judge,240,190);ctx.fillStyle=judge==='MISS'?'#ff82bd':'#fff0a7';ctx.fillText(judge,240,190)}$('stats').textContent=`SCORE ${score}　COMBO ${combo}　MAX ${best}`}draw();</script></html>
