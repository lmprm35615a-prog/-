<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BEAT ROOM SOLO</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 10%,#ffe0f1,transparent 36%),radial-gradient(circle at 90% 25%,#d8e7ff,transparent 42%),#fff8ee;color:#30244e;font:15px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:28px 20px}header{display:flex;align-items:center;gap:18px;margin:0 0 22px}.logo{background:#ff6a9f;color:white;border:3px solid #30244e;box-shadow:4px 4px 0 #30244e;border-radius:20px;padding:12px 16px;font-size:28px;font-weight:1000;transform:rotate(-7deg)}h1{font-size:clamp(32px,6vw,60px);font-weight:1000;letter-spacing:-.07em;line-height:1;margin:0;color:#30244e}header p{margin:7px 0 0;font-weight:700;color:#8a729b}section{background:#fff;border:2px solid #30244e;padding:18px;border-radius:24px;margin:12px 0;box-shadow:5px 6px 0 #30244e}input,button,select{font:inherit;color:#30244e;background:#f8f4ff;border:2px solid #30244e;border-radius:12px;padding:10px 13px;margin:4px;font-weight:750}button{cursor:pointer;background:#fce27e;box-shadow:0 3px 0 #30244e;transition:transform .12s,background .12s}button:hover{transform:translateY(-2px);background:#fff0a7}button:active{transform:translateY(3px);box-shadow:none}#embedded{background:#ff6a9f;color:white}#demo{background:#98edce}#stop{background:#eee5ff}input#url{width:min(100%,520px)}input[type=number]{width:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}canvas{width:100%;display:block;border:2px solid #30244e;border-radius:18px;background:#211b40}#pads{display:flex;gap:5px;margin-top:10px}#pads button{flex:1;min-width:0;font-size:28px;touch-action:none;padding:5px;color:#30244e!important}#pads svg{width:31px;height:31px;display:block;margin:auto}#player iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}#status{color:#7251a2;font-weight:800;margin-top:12px}#stats{font-weight:950;font-size:19px;letter-spacing:.03em;margin-bottom:12px}p{line-height:1.65;color:#756985;font-size:13px}a{color:#7251a2}@media(max-width:740px){.grid{grid-template-columns:1fr}main{padding:18px 12px}}#result{position:fixed;inset:0;background:#30244eb8;display:grid;place-items:center;z-index:10;padding:20px}#result[hidden]{display:none}#result section{text-align:center;width:min(440px,100%);background:#fff5fa}#rank{font-size:100px;font-weight:1000;color:#ff6a9f;text-shadow:4px 4px #30244e;line-height:1.1}#detail{white-space:pre-line;font-weight:800;line-height:1.8} </style><main><header><div class="logo">♫</div><div><h1>BEAT ROOM<span style="color:#ff6a9f">!</span></h1><p>SOLO MODE / 好きな曲でリズムに乗ろう！</p></div></header><section><input id="url" placeholder="YouTubeのURL"><button id="load">曲を選ぶ</button><button id="open">YouTubeで再生</button><p>埋め込みが再生できない場合も、別タブのYouTubeと一緒に遊べます。</p><label>BPM <input id="bpm" type="number" min="40" max="240" value="120"></label><button id="tap">拍に合わせてタップ</button><label>開始位置（秒）<input id="offset" type="number" min="0" step="0.1" value="1"></label><label>別タブ曲の長さ（秒）<input id="manualDuration" type="number" min="5" value="180"></label><label>難易度 <select id="level"><option value="1">EASY</option><option value="2" selected>NORMAL</option><option value="3">HARD</option><option value="4">EXPERT ★ 激ムズ</option></select></label><br><button id="start">ゲーム開始（別タブ再生用）</button><button id="embedded">動画と同時に開始</button><button id="demo">練習（音付き）</button><button id="stop">終了</button><div id="status" role="status">曲を選ぶか、練習から始めましょう。</div></section><div class="grid"><section><div id="stats">SCORE 0　COMBO 0</div><canvas id="board" width="480" height="480"></canvas><div id="pads"></div></section><section><div id="player"></div><p>別タブモード：YouTubeで曲を再生し、ゲームに戻って開始を押してください。開始位置を調整して拍を合わせられます。Pキーで一時停止・再開（ゲーム側のみ）。</p><p>HARD：2方向同時押し　／　EXPERT：高速連打・2〜3方向同時押し。ノーツはBPMから生成します。音源の自動解析ではありません。</p></section></div></main><div id="result" hidden><section><h2>RESULT / おつかれさま！</h2><div id="rank"></div><div id="detail"></div><button id="retry">もう一度</button><button id="closeResult">閉じる</button></section></div><script>
const $=x=>document.getElementById(x), ctx=$('board').getContext('2d'), arrows=['←','↓','↑','→'],keys=['ArrowLeft','ArrowDown','ArrowUp','ArrowRight'],colors=['#ff82bd','#72c9ff','#a4ef9c','#ffd366'];let video='',player=null,ready=false,mode='',active=false,paused=false,started=0,held=0,notes=[],score=0,combo=0,best=0,judge='',judgeAt=0,audio,lastBeat=-1,bpm=120,duration=180,taps=[];let playLevel=2;let countdown=0,waiting=false,fx=[],counts={PERFECT:0,GREAT:0,GOOD:0,MISS:0};const say=s=>$('status').textContent=s;function parse(s){try{let u=new URL(s);if(u.hostname==='youtu.be')return u.pathname.split('/')[1];if(u.hostname==='youtube.com'||u.hostname.endsWith('.youtube.com'))return u.searchParams.get('v')||u.pathname.split('/').pop()}catch{}return s.trim()};function select(){let id=parse($('url').value);if(!/^[\w-]{11}$/.test(id)){say('YouTubeのURLを確認してください');return false}video=id;if(ready)player.cueVideoById(video);else if(!player){$('player').replaceChildren();let f=document.createElement('iframe');f.src='https://www.youtube.com/embed/'+video;f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;$('player').append(f)}say('曲を選択しました。別タブ再生はAPI不要です。');return true} $('load').onclick=select;$('open').onclick=()=>{if(select())window.open('https://www.youtube.com/watch?v='+video,'_blank','noopener')};window.onYouTubeIframeAPIReady=()=>{ $('player').innerHTML='<div id="yt"></div>';player=new YT.Player('yt',{playerVars:{playsinline:1,...(location.protocol!=='file:'?{origin:location.origin}:{})},events:{onReady:()=>{ready=true;if(video)player.cueVideoById(video)},onStateChange:e=>{if(active&&mode==='embed'&&e.data===0)finish()},onError:()=>say('埋め込み再生不可。YouTubeで再生ボタンをご利用ください。')}})};let script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';document.head.append(script);
$('tap').onclick=()=>{let t=performance.now();if(t-(taps.at(-1)||0)>2000)taps=[];taps.push(t);if(taps.length>8)taps.shift();if(taps.length>1)$('bpm').value=Math.max(40,Math.min(240,Math.round(60000*(taps.length-1)/(t-taps[0]))))};function makeChart(level,bpm,offset,duration){const out=[],beat=60/bpm,step=beat*(level===1?2:level===2?1:level===3?.5:.25);let prev=[];for(let i=0,t=offset;t<duration-.20;i++,t=offset+i*step){if(level===4&&i%16===15)continue;let count=1;if(level===3&&(i%8===4||i%8===6||i%8===0&&i>0))count=2;if(level===4){if(i%16===0||i%16===12)count=3;else if(i%4===2||i%8===4)count=2;}let lanes=[0,1,2,3].map(l=>({l,r:Math.random()+(prev.includes(l)?1:0)})).sort((a,b)=>a.r-b.r).slice(0,count).map(x=>x.l);for(const l of lanes)out.push({t,l,done:false});prev=lanes;}return out;}function begin(m){if(m!=='demo'&&!video&&!select())return;if(m==='embed'&&!ready){say('動画連携が利用できません。');return}if(m==='embed'&&!player.getDuration()){say('動画の読み込みが完了してから再度押してください。');return}if(active&&mode==='embed')player.pauseVideo();mode=m;active=true;paused=false;waiting=false;score=combo=best=0;judge='';judgeAt=0;fx=[];counts={PERFECT:0,GREAT:0,GOOD:0,MISS:0};lastBeat=-1;bpm=Math.max(40,Math.min(240,+$('bpm').value||120));let level=playLevel=+$('level').value,offset=Math.max(0,+$('offset').value||0);duration=m==='demo'?30:m==='embed'?player.getDuration():Math.max(5,+$('manualDuration').value||180);notes=[];notes=makeChart(level,bpm,offset,duration);if(m==='embed'){player.pauseVideo();player.seekTo(0,true)}if(m==='demo'){audio=audio||new AudioContext();audio.resume()}$('result').hidden=true;countdown=performance.now()+3000;started=countdown;document.activeElement.blur();say('READY!')} $('start').onclick=()=>begin('manual');$('embedded').onclick=()=>begin('embed');$('demo').onclick=()=>begin('demo');function finish(){if(!active)return;active=false;countdown=0;waiting=false;if(mode==='embed')player.pauseVideo();for(const n of notes){if(!n.done){n.done=true;counts.MISS++}}let acc=notes.length?score/(notes.length*1000)*100:0;let rank=acc>=95?'S':acc>=80?'A':acc>=60?'B':'C';$('rank').textContent=rank;$('detail').textContent=`SCORE ${score}\n精度 ${acc.toFixed(1)}% / MAX COMBO ${best}\nPERFECT ${counts.PERFECT}　GREAT ${counts.GREAT}\nGOOD ${counts.GOOD}　MISS ${counts.MISS}`;$('result').hidden=false;say('FINISH!')} $('stop').onclick=finish;$('retry').onclick=()=>begin(mode);$('closeResult').onclick=()=>{$('result').hidden=true};function time(){if(countdown)return (performance.now()-countdown)/1000;return mode==='embed'?player.getCurrentTime():((paused?held:performance.now())-started)/1000}function hit(l){if(!active||paused||countdown||waiting)return;let t=time(),n=notes.filter(n=>!n.done&&n.l===l&&Math.abs(n.t-t)<=.20).sort((a,b)=>Math.abs(a.t-t)-Math.abs(b.t-t))[0];if(n){n.done=true;let e=Math.abs(n.t-t);judge=e<=.060?'PERFECT':e<=.120?'GREAT':'GOOD';counts[judge]++;score+=judge==='PERFECT'?1000:judge==='GREAT'?700:400;best=Math.max(best,++combo);fx.push({l,at:performance.now(),judge})}else{judge='MISS';combo=0}judgeAt=performance.now()}addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(keys.includes(e.key)){e.preventDefault();if(!e.repeat)hit(keys.indexOf(e.key))}if(e.key.toLowerCase()==='p'&&active&&!countdown&&!waiting&&!e.repeat){if(paused){started+=performance.now()-held;paused=false;if(mode==='embed')player.playVideo()}else{held=performance.now();paused=true;if(mode==='embed')player.pauseVideo()}}});arrows.forEach((a,i)=>{let b=document.createElement('button');b.innerHTML=`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5 L56 29 Q59 33 54 35 H43 V55 Q43 59 39 59 H25 Q21 59 21 55 V35 H10 Q5 33 8 29 Z" transform="rotate(${[-90,180,0,90][i]} 32 32)" fill="#30244e"/></svg>`;b.setAttribute('aria-label',a);b.style.background=colors[i];b.onpointerdown=e=>{e.preventDefault();hit(i)};$('pads').append(b)});function tone(){let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=650;g.gain.setValueAtTime(.15,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.09);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.1)}function arrow(x,y,i,size,target=false){ctx.save();ctx.translate(x,y);ctx.rotate([-Math.PI/2,Math.PI,0,Math.PI/2][i]);ctx.scale(size/64,size/64);ctx.translate(-32,-32);ctx.beginPath();ctx.moveTo(32,5);ctx.lineTo(56,29);ctx.quadraticCurveTo(60,35,53,36);ctx.lineTo(44,36);ctx.lineTo(44,54);ctx.quadraticCurveTo(44,60,38,60);ctx.lineTo(26,60);ctx.quadraticCurveTo(20,60,20,54);ctx.lineTo(20,36);ctx.lineTo(11,36);ctx.quadraticCurveTo(4,35,8,29);ctx.closePath();ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle=target?colors[i]:'#211b40';ctx.fillStyle=target?'#30264d':colors[i];if(!target){ctx.shadowColor=colors[i];ctx.shadowBlur=13;}ctx.fill();ctx.shadowBlur=0;ctx.stroke();if(!target){ctx.globalAlpha=.65;ctx.strokeStyle='white';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(15,28);ctx.lineTo(32,11);ctx.stroke();}ctx.restore()}
function draw(){requestAnimationFrame(draw);ctx.clearRect(0,0,480,480);ctx.textAlign='center';for(let i=0;i<4;i++){ctx.fillStyle=i%2?'#292144':'#221b3b';ctx.fillRect(i*120,0,119,480);ctx.globalAlpha=.11;ctx.fillStyle=colors[i];ctx.fillRect(i*120+5,0,110,480);ctx.globalAlpha=1;ctx.fillStyle='#141029';ctx.beginPath();ctx.roundRect(i*120+9,374,102,94,18);ctx.fill();arrow(i*120+60,420,i,70,true)}ctx.strokeStyle='#ffffff88';ctx.setLineDash([5,8]);ctx.beginPath();ctx.moveTo(0,420);ctx.lineTo(480,420);ctx.stroke();ctx.setLineDash([]);if(active){if(countdown&&performance.now()>=countdown){countdown=0;started=performance.now();if(mode==='embed'){waiting=true;player.playVideo()}say('PLAY!')}if(waiting&&player.getPlayerState()===1)waiting=false;let t=waiting?0:time();if(mode==='demo'&&!paused&&!countdown){let b=Math.floor(t*bpm/60);if(b!==lastBeat){lastBeat=b;tone()}}for(const n of notes){if(n.done)continue;let dt=n.t-t;if(dt<-.20){n.done=true;counts.MISS++;combo=0;judge='MISS';judgeAt=performance.now();continue}let speed=playLevel===4?410:230;if(dt>420/speed+.22)break;arrow(n.l*120+60,420-dt*speed,n.l,76)}if(!countdown&&!waiting&&(t>=duration||(mode==='embed'&&player.getPlayerState()===0)))finish()}fx=fx.filter(f=>performance.now()-f.at<500);for(const f of fx){let p=(performance.now()-f.at)/500,x=f.l*120+60,y=420;ctx.save();ctx.globalAlpha=1-p;ctx.strokeStyle=colors[f.l];ctx.lineWidth=6*(1-p)+1;ctx.shadowColor=colors[f.l];ctx.shadowBlur=22;ctx.beginPath();ctx.arc(x,y,12+p*70,0,Math.PI*2);ctx.stroke();for(let j=0;j<12;j++){let a=j*Math.PI/6,r=16+p*85;ctx.fillStyle=j%2?'white':colors[f.l];ctx.beginPath();ctx.arc(x+Math.cos(a)*r,y+Math.sin(a)*r,5*(1-p)+1,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=(1-p)*.65;ctx.fillStyle='white';ctx.beginPath();ctx.arc(x,y,27*(1-p),0,Math.PI*2);ctx.fill();ctx.restore()}if(countdown||waiting){ctx.fillStyle='#211b4088';ctx.fillRect(0,0,480,480);ctx.font='1000 100px system-ui';ctx.fillStyle='#fff0a7';ctx.fillText(countdown?Math.max(1,Math.ceil((countdown-performance.now())/1000)):'GO!',240,255)}if(performance.now()-judgeAt<650&&judge){ctx.font='1000 37px system-ui';ctx.lineJoin='round';ctx.lineWidth=7;ctx.strokeStyle='#211b40';ctx.strokeText(judge,240,190);ctx.fillStyle=judge==='MISS'?'#ff82bd':'#fff0a7';ctx.fillText(judge,240,190)}$('stats').textContent=`SCORE ${score}　COMBO ${combo}　MAX ${best}`}draw();</script></html>
